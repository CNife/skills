[project]
name = "cnife-skills"
version = "0.1.0"
description = "CNife's Agent Skills - Python scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pre-commit>=4.6.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C4", "PIE", "RUF", "W"]
# 允许中文全角标点（docstring、注释、help 文本中大量使用中文）
allowed-confusables = [
  "，",
  "。",
  "：",
  "；",
  "！",
  "？",
  "（",
  "）",
  "【",
  "】",
  "《",
  "》",
]

[tool.ruff.lint.per-file-ignores]
# main() 兜底 except Exception 是有意 catch-all（一切异常转结构化错误）；
# 0.15.11 不报 BLE001（noqa 会被判 unused 删掉）、0.16.1 报，用 per-file-ignores 统一。
"pi-agent/herdr-subagent/scripts/subagent.py" = ["BLE001"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
